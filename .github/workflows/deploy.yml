name: Deploy to GitHub Pages

on:
  # Publish on a schedule rather than on push, so changes can land on master
  # ahead of going live. cron is UTC and best-effort (fires ~on time).
  # 16:00 UTC = 9:00 AM PDT (Pacific, summer). Recurs every Monday.
  schedule:
    - cron: "0 16 * * 1"
  # Manual "Run workflow" button to publish on demand at any time.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
